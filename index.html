<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>泡泡</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f6f5fb; --surface:#ffffff; --surface-2:#f1f0fa;
    --ink:#22212e; --ink-soft:#6b6980; --ink-faint:#a3a1b8;
    --line:#e7e5f2; --accent:#6a5bf0; --accent-ink:#ffffff;
    --accent-soft:#eeecfd; --out-bg:#f1f0fa; --danger:#e0645f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; justify-content:center;
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans SC",system-ui,sans-serif;
    padding:24px 16px;
  }
  .mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;}
  #app{ width:100%; max-width:400px; }
  header{
    display:flex; align-items:center; gap:10px; padding:6px 4px 20px;
  }
  header .mark{
    width:32px;height:32px;border-radius:10px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px;
  }
  header h1{font-size:18px;margin:0;font-weight:900;letter-spacing:.01em;}
  header .sub{font-size:11px;color:var(--ink-faint);margin-top:1px;}

  .intro{color:var(--ink-soft);font-size:13px;line-height:1.7;margin-bottom:18px;}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    padding:24px; box-shadow:0 12px 30px -16px rgba(80,70,160,.25);
  }
  .card .app-name{font-weight:800;font-size:16px;margin-bottom:2px;}
  .card .app-sub{font-size:12px;color:var(--ink-faint);margin-bottom:18px;}
  label{display:block;font-size:11px;color:var(--ink-faint);font-weight:600;margin:0 0 5px;letter-spacing:.03em;text-transform:uppercase;}
  input{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 13px;
    font-size:13.5px; color:var(--ink); margin-bottom:14px; background:var(--surface-2);
    font-family:"JetBrains Mono",monospace;
  }
  input:focus{outline:none;border-color:var(--accent);background:#fff;}
  input::placeholder{color:var(--ink-faint);}
  #pass{letter-spacing:.3em;}
  button{
    width:100%; background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px;
    padding:12px; text-align:center; font-size:13.5px; font-weight:700; margin-top:2px; cursor:pointer;
  }
  button:hover{opacity:.92;}
  .hint{font-size:11.5px;color:#a3742a;background:#fdf4e3;border-radius:8px;padding:9px 11px;margin-top:12px;line-height:1.6;}
  .error{font-size:11.5px;color:var(--danger);margin-top:12px;}

  .tabs{display:flex;gap:6px;margin-bottom:14px;}
  .tabs button{
    flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);
    border-radius:10px;padding:9px;font-size:12.5px;margin:0;font-weight:500;font-family:inherit;
  }
  .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}

  .thread{display:flex;flex-direction:column;}
  .msg-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:10px;}
  .msg-row.out{flex-direction:row-reverse;}
  .msg-avatar{
    width:26px;height:26px;border-radius:50%;flex:none;
    background:linear-gradient(135deg,#a99cf5,var(--accent)) center/cover;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .msg-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .msg-sys{text-align:center;font-size:10.5px;color:var(--ink-faint);margin:2px 0 10px;font-family:"JetBrains Mono",monospace;}
  .msg-col{display:flex;flex-direction:column;max-width:74%;}
  .msg-row.out .msg-col{align-items:flex-end;}
  .msg{border-radius:14px;padding:9px 13px;font-size:13px;line-height:1.5;}
  .msg.in{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .msg.out{background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
  .msg-time{font-size:9.5px;color:var(--ink-faint);margin-top:3px;padding:0 2px;}

  .note{font-size:12px;color:var(--ink-soft);margin-bottom:14px;line-height:1.6;background:var(--surface-2);border-radius:10px;padding:10px 12px;}

  .loggedas{font-size:11.5px;color:var(--ink-faint);margin-bottom:12px;}
  [hidden]{display:none!important;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="mark">泡</div>
    <div>
      <h1>泡泡</h1>
      <div class="sub">粉丝专属通讯</div>
    </div>
  </header>

  <p class="intro" id="intro">粉丝专属通讯 App，登录后能看到这个账号收到过的所有消息。Bubble ID 和 PIN 都没人直接告诉过你——要从别处拼出来。</p>

  <div class="card" id="login-card">
    <div class="app-name">登录泡泡</div>
    <div class="app-sub">使用你的 Bubble ID 登录</div>
    <label>Bubble ID</label>
    <input id="user" type="text" placeholder="artist_name0000" autocomplete="off" />
    <label>PIN</label>
    <input id="pass" type="password" placeholder="····" maxlength="4" autocomplete="off" />
    <button id="login-btn">登录</button>
    <div id="login-msg"></div>
  </div>

  <div class="card" id="inbox-card" hidden>
    <div class="loggedas" id="loggedas"></div>
    <div class="tabs">
      <button data-tab="broadcast" class="active">群发消息</button>
      <button data-tab="personal">专属消息</button>
    </div>
    <div id="tab-content"></div>
  </div>
</div>

<footer style="text-align:center;font-size:10.5px;color:var(--ink-faint);padding:14px 0 6px;letter-spacing:.04em;">made by CAIP</footer>

<script>
  const DATA = {
    login: { username: "ricecake0412", password: "0622" },
    broadcasts: [
      { time: "09-10 07:30", from: "周晏星STUDIO", text: "早呀，今天也要元气满满！记得看今晚的直播哦～" },
      { time: "09-11 22:10", from: "周晏星STUDIO", text: "巡演倒计时3天，好紧张但也好期待，杭州的姐妹到时候见！" },
      { time: "09-13 07:45", from: "周晏星STUDIO", text: "今天行程有点满，晚点更新，大家等我～" }
    ],
    personalMessages: {
      note: "这些不是群发——只有这个账号收到过。",
      messages: [
        { from: "周晏星", time: "07-20 21:00", text: "巡演彩排定妆照发我看看呗" },
        { from: "你", time: "07-20 21:05", text: "不行，剧透" },
        { from: "周晏星", time: "07-25 19:40", text: "新歌录完了，超累" },
        { from: "你", time: "07-25 19:45", text: "辛苦啦，早点休息" },
        { from: "周晏星", time: "08-02 22:10", text: "你说要是有一天不干这行了会怎么样" },
        { from: "你", time: "08-02 22:15", text: "那也挺好的啊" },
        { from: "周晏星", time: "08-02 22:16", text: "随口说说" },
        { from: "周晏星", time: "08-08 20:30", text: "今天彩排好累" },
        { from: "你", time: "08-08 20:35", text: "早点睡，别等我" },
        { from: "周晏星", time: "08-15 19:00", text: "你是不是又没吃饭" },
        { from: "你", time: "08-15 19:05", text: "年糕今天又打翻猫粮了" },
        { from: "周晏星", time: "08-20 23:20", text: "采访问了些很奇怪的问题" },
        { from: "你", time: "08-20 23:22", text: "比如" },
        { from: "周晏星", time: "08-20 23:25", text: "算了不说了" },
        { from: "周晏星", time: "08-27 22:00", text: "最近真的睡不够" },
        { from: "你", time: "08-27 22:01", text: "明天应该会好一点" },
        { from: "周晏星", time: "09-02 21:15", text: "杭州那场巡演海报出了，好看嘛" },
        { from: "你", time: "09-02 21:20", text: "好看，你也是" },
        { from: "周晏星", time: "09-05 20:40", text: "今天录了个很长的采访" },
        { from: "你", time: "09-05 20:41", text: "辛苦了" },
        { from: "周晏星", time: "09-09 22:50", text: "有时候觉得这些安排都不是我自己能说了算的" },
        { from: "你", time: "09-09 22:55", text: "怎么突然这么说" },
        { from: "周晏星", time: "09-09 23:00", text: "没事，就是感慨一下" },
        { from: "周晏星", time: "09-13 19:26", text: "计划变了，不去了。", clueId: "c25" },
        { from: "周晏星", time: "09-13 20:02", text: "你别过来。" },
        { from: "周晏星", time: "09-13 20:36", text: "算了。来吧。", clueId: "c26" },
        { from: "你", time: "09-13 20:50", text: "到底怎么了" },
        { from: "你", time: "09-13 21:06", text: "到了，楼下等我一下。", clueId: "c27" },
        { from: "周晏星", time: "09-13 21:47", text: "那时候我没保护好你。这次我不会再让他们说你。" },
        { from: "你", time: "09-13 22:11", text: "你先把自己的事情处理清楚。别再来找我了。" },
        { from: "周晏星", time: "09-13 23:12", text: "今晚真的说了很多。" },
        { from: "周晏星", time: "09-13 23:12", text: "谢谢你听我说完。", clueId: "c28" },
        { from: "周晏星", time: "09-13 23:52", text: "你睡了吗？", meta: "未读", clueId: "c29" },
        { from: "系统", time: "09-13 23:52", text: "对方已下线", system: true }
      ]
    }
  };

  let attempts = 0;
  let activeTab = "broadcast";

  const loginCard = document.getElementById("login-card");
  const inboxCard = document.getElementById("inbox-card");
  const intro = document.getElementById("intro");
  const loginMsg = document.getElementById("login-msg");

  // 有些输入法手动打字时会把字母数字打成全角，肉眼几乎看不出来，但和
  // 半角字符串直接比较会判定不相等——粘贴进来的内容不受输入法影响所以
  // 能通过，手打却总是提示不对。这里统一转回半角再比较。
  const toHalfWidth = (s) => s.replace(/[！-～]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, " ");
  const norm = (s) => toHalfWidth(s).trim().toLowerCase();

  document.getElementById("login-btn").addEventListener("click", () => {
    const u = norm(document.getElementById("user").value);
    const p = norm(document.getElementById("pass").value);
    if (u === norm(DATA.login.username) && p === norm(DATA.login.password)) {
      loginCard.hidden = true;
      intro.hidden = true;
      inboxCard.hidden = false;
      document.getElementById("loggedas").textContent = `已登录：${DATA.login.username}`;
      renderTab();
      return;
    }
    attempts++;
    if (attempts >= 3) {
      loginMsg.innerHTML = `<div class="hint">PIN 是 4 位数字。Bubble ID 通常是「英文词根 + 数字」的组合，不一定是本名。</div>`;
    } else {
      loginMsg.innerHTML = `<div class="error">Bubble ID 或 PIN 不正确。</div>`;
    }
  });

  document.querySelectorAll(".tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeTab = btn.dataset.tab;
      document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("active", b === btn));
      renderTab();
    });
  });

  function renderTab() {
    const el = document.getElementById("tab-content");
    if (activeTab === "broadcast") {
      el.innerHTML = `<div class="thread">${DATA.broadcasts
        .map((m) => msgRowHtml(m, false))
        .join("")}</div>`;
      return;
    }
    el.innerHTML = `
      <p class="note">${DATA.personalMessages.note}</p>
      <div class="thread">${DATA.personalMessages.messages
        .map((m) => msgRowHtml(m, m.from === "你"))
        .join("")}</div>
    `;
  }

  function msgRowHtml(m, isOut) {
    if (m.system) {
      return `<div class="msg-sys">${m.text} · ${m.time}</div>`;
    }
    const avatarSrc = isOut ? "images/avatar-shiguang-cat.jpg" : "images/fan-avatar-yanxing-variety.jpg";
    return `
      <div class="msg-row ${isOut ? "out" : ""}">
        <div class="msg-avatar"><img src="${avatarSrc}" alt="" /></div>
        <div class="msg-col">
          <div class="msg ${isOut ? "out" : "in"}">${m.text}</div>
          <div class="msg-time mono">${m.time}${m.meta ? " · " + m.meta : ""}</div>
        </div>
      </div>
    `;
  }
</script>
</body>
</html>
